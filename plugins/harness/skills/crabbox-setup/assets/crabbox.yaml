# .crabbox.yaml — copy to the repo ROOT as `.crabbox.yaml`
#
# NOTE: the box identity (static.host/user/workRoot, ssh.key) deliberately does
# NOT live here — crabbox refuses repo-configured SSH hosts (a cloned repo must
# not be able to point your key at a stranger's box). It lives in the user
# config ~/.config/crabbox/config.yaml (see SKILL.md Step 0), and cbx.sh exports
# CRABBOX_STATIC_HOST as explicit approval.
provider: ssh
target: linux
sync:
  exclude:                        # EDIT: build/dep dirs for your stack
    - node_modules
    - .next
    - dist
    - build
    - .turbo
    - evidence                    # agent writes screenshots/video here on the box
    - "**/.env"
    - "**/.env.local"             # secrets are gitignored → forwarded via env.allow, NOT synced
env:
  allow: []                       # EDIT: exact secret var names the app needs at runtime,
                                  #   forwarded from your shell → box over encrypted SSH
